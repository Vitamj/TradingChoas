[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-chaos-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<1",
]

[tool.setuptools]
packages = ["trading_chaos_api"]

[tool.pytest.ini_options]
testpaths = ["test/mlops"]

[tool.coverage.run]
source = ["trading_chaos_api"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
