name: MLflow HW3

on:
  push:
    branches: [main, hw2, hw3]
    paths:
      - "mlflow_hw3/**"
      - ".github/workflows/mlflow-hw3.yml"
  pull_request:
    branches: [main, hw2]
    paths:
      - "mlflow_hw3/**"
      - ".github/workflows/mlflow-hw3.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlflow_hw3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mlflow_hw3/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Format check
        run: ruff format --check app tests
      - name: Unit tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing
      - name: Validate Compose configuration
        run: docker compose config -q

  integration:
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlflow_hw3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start tracking server and storage
        run: |
          cp .env.example .env
          docker compose up -d --build
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Run EDA and train models
        run: docker compose --profile train run --rm --build trainer
      - name: Start inference application
        run: |
          docker compose --profile inference up -d --build inference
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Smoke test POST process
        run: |
          python - <<'PY'
          import csv
          import json
          from urllib.request import Request, urlopen

          with open("data/brent_prices.csv", newline="", encoding="utf-8-sig") as source:
              rows = list(csv.DictReader(source))

          unique_rows = {row["date"]: row for row in rows}
          history = sorted(unique_rows.values(), key=lambda row: row["date"])[-11:]
          payload = {
              "candles": [
                  {
                      "date": row["date"],
                      "open": float(row["open"]),
                      "high": float(row["high"]),
                      "low": float(row["low"]),
                      "close": float(row["close"]),
                      "volume": float(row["volume"]),
                  }
                  for row in history
              ]
          }
          request = Request(
              "http://127.0.0.1:8000/process",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(request, timeout=20) as response:
              result = json.load(response)
          assert result["prediction"] in (0, 1)
          assert result["model_alias"] == "champion"
          assert result["model_version"]
          assert result["run_id"]
          print(json.dumps(result, indent=2))
          PY
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down -v
