global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
    metrics_path: /metrics
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8001
  - job_name: source
    static_configs: [{targets: ["source:9100"]}]
  - job_name: rabbitmq
    static_configs: [{targets: ["rabbitmq:15692"]}]
