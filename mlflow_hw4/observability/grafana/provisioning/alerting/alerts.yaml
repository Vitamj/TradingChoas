apiVersion: 1
groups:
  - orgId: 1
    name: pipeline-alerts
    folder: MLOps
    interval: 10s
    rules:
      - uid: queue-near-capacity
        title: Queue above 90 percent
        condition: C
        for: 1m
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 120, to: 0}
            model:
              expr: 'max(rabbitmq_queue_messages_ready{queue="tasks.bounded"}) / 11'
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {type: threshold, expression: A, refId: C, conditions: [{type: query, evaluator: {type: gt, params: [0.9]}, operator: {type: and}, reducer: {type: last, params: []}, query: {params: [C]}}]}
        annotations:
          summary: Queue has stayed above 90% for one minute
      - uid: dlq-not-empty
        title: DLQ contains messages
        condition: C
        for: 10s
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              expr: 'max(rabbitmq_queue_messages{queue="tasks.bounded.dlq"})'
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model: {type: threshold, expression: A, refId: C, conditions: [{type: query, evaluator: {type: gt, params: [0]}, operator: {type: and}, reducer: {type: last, params: []}, query: {params: [C]}}]}
        annotations:
          summary: A poison message reached the dead-letter queue
